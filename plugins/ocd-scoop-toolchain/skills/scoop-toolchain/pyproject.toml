[project]
name = "scoop-toolchain"
version = "0.1.0"
description = "Scoop toolchain workflow runtime"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
scoop-toolchain = "scoop_toolchain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoop_toolchain"]
